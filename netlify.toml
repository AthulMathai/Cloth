[build]
  publish = "public"
  command = "node scripts/write-env.mjs"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[functions]
  node_bundler = "esbuild"

# Lifecycle jobs (publish scheduled drops, archive sold-out drops)
[functions."scheduled-lifecycle"]
  schedule = "*/10 * * * *"

# Fulfillment: missed routing, backorders, overdue/late alerts, partner webhooks, test carrier
[functions."scheduled-fulfillment"]
  schedule = "*/5 * * * *"

# Customer emails (order updates, design decisions, support replies)
[functions."scheduled-emails"]
  schedule = "*/2 * * * *"

# AI: refresh the product meaning index (search) for new/changed products
[functions."scheduled-ai"]
  schedule = "17 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/partner/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API: /api/<name> -> Netlify Function <name>
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Search engines
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/robots"
  status = 200
  force = true

# Single-page app: every unknown path renders index.html (functions excluded).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
