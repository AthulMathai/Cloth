[build]
  publish = "public"
  command = "node scripts/write-env.mjs"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Lifecycle jobs (publish scheduled drops, archive sold-out drops)
[functions."scheduled-lifecycle"]
  schedule = "*/10 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API: /api/<name> -> Netlify Function <name>
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single-page app: every unknown path renders index.html (functions excluded).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
